[package]
name = "capsacin-studio"
version = "0.1.2"
description = "capSACIN Studio — Capsid Surface Abstraction Desktop App"
authors = ["SAMPEL Group"]
edition = "2021"

[lib]
name = "capsacin_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-std", "io-util", "sync", "macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
